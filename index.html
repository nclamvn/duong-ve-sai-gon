<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đường về Sài Gòn · G0′</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0f14; --fg: #e6edf3; --muted: #8b949e; --accent: #ffb454; --danger: #ff5c5c; --ok: #3fb950; --warn: #d29922;
        --hud-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--hud-font); overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .layer { position: fixed; inset: 0; pointer-events: none; }
      #capability { pointer-events: auto; display: grid; place-items: center; background: var(--bg); z-index: 20; }
      #capability .card { max-width: 560px; padding: 32px; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; }
      #capability h1 { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
      #capability table { font-family: var(--mono); font-size: 12px; border-collapse: collapse; width: 100%; margin: 12px 0 20px; }
      #capability td { padding: 4px 8px; border-bottom: 1px solid #21262d; }
      #capability td:first-child { color: var(--muted); }
      #capability button { pointer-events: auto; font: inherit; padding: 10px 18px; background: var(--accent); color: #0b0f14; border: 0; border-radius: 4px; cursor: pointer; font-weight: 600; }
      #overlay { position: fixed; top: 8px; left: 8px; font-family: var(--mono); font-size: 11px; line-height: 1.35; background: rgba(11,15,20,.72); padding: 8px 10px; border-radius: 4px; white-space: pre; pointer-events: none; z-index: 30; }
      #overlay .ok { color: var(--ok); } #overlay .warn { color: var(--warn); } #overlay .bad { color: var(--danger); }
      /* HUD/phụ đề: src/ui/hud.css (TIP-UX02) */
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="layer" hidden></div>
    <div id="subtitles" hidden></div>
    <pre id="overlay" hidden></pre>
    <div id="capability" class="layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
