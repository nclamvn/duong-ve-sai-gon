<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hải Tuyến · Mắt Bão · G0</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0f14; --fg: #e6edf3; --muted: #8b949e; --accent: #ffb454; --danger: #ff5c5c; --ok: #3fb950; --warn: #d29922;
        --hud-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--hud-font); overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .layer { position: fixed; inset: 0; pointer-events: none; }
      #capability { pointer-events: auto; display: grid; place-items: center; background: var(--bg); z-index: 20; }
      #capability .card { max-width: 560px; padding: 32px; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; }
      #capability h1 { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
      #capability table { font-family: var(--mono); font-size: 12px; border-collapse: collapse; width: 100%; margin: 12px 0 20px; }
      #capability td { padding: 4px 8px; border-bottom: 1px solid #21262d; }
      #capability td:first-child { color: var(--muted); }
      #capability button { pointer-events: auto; font: inherit; padding: 10px 18px; background: var(--accent); color: #0b0f14; border: 0; border-radius: 4px; cursor: pointer; font-weight: 600; }
      #overlay { position: fixed; top: 8px; left: 8px; font-family: var(--mono); font-size: 11px; line-height: 1.35; background: rgba(11,15,20,.72); padding: 8px 10px; border-radius: 4px; white-space: pre; pointer-events: none; z-index: 30; }
      #overlay .ok { color: var(--ok); } #overlay .warn { color: var(--warn); } #overlay .bad { color: var(--danger); }
      #hud { z-index: 10; font-size: clamp(12px, 1.2vw, 18px); }
      #hud .objective { position: absolute; top: 4%; left: 50%; transform: translateX(-50%); color: var(--accent); letter-spacing: .04em; text-transform: uppercase; font-size: .85em; }
      #hud .ammo { position: absolute; right: 4%; bottom: 5%; font-family: var(--mono); font-size: 1.6em; }
      #hud .ammo small { font-size: .5em; color: var(--muted); }
      #hud .health { position: absolute; left: 4%; bottom: 5%; font-family: var(--mono); }
      #hud .prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 3px; }
      #hud .crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: #fff; border-radius: 50%; box-shadow: 0 0 2px #000; }
      #hud .crosshair::before, #hud .crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
      #hud .crosshair::before { left: 50%; top: calc(-1 * var(--gap, 10px)); width: 1px; height: 6px; transform: translateX(-50%); }
      #hud .crosshair::after { top: 50%; left: calc(-1 * var(--gap, 10px)); height: 1px; width: 6px; transform: translateY(-50%); }
      #subtitles { position: fixed; left: 50%; bottom: 10%; transform: translateX(-50%); max-width: 70%; text-align: center; font-size: clamp(14px, 1.4vw, 22px); background: rgba(0,0,0,var(--sub-bg, .55)); padding: 6px 14px; border-radius: 4px; z-index: 12; }
      #subtitles .speaker { color: var(--accent); font-weight: 600; margin-right: .4em; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="layer" hidden></div>
    <div id="subtitles" hidden></div>
    <pre id="overlay" hidden></pre>
    <div id="capability" class="layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
