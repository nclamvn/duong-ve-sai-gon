    value: "AC-130A (16th SOS, Ubon) 1969–1971 mang minigun 7,62 mm, pháo 20 mm Vulcan và (Surprise Package/Pave Pronto) pháo 40 mm Bofors; bay vòng \"pylon turn\" quanh mục tiêu, dùng kính nhìn đêm và hồng ngoại để săn xe ban đêm trên đường mòn."
