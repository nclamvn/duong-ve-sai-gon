    value: "Giai đoạn Commando Hunt cuối (10/1970–4/1972) trung bình mỗi ngày trên đường mòn có 182 máy bay tiêm kích-cường kích, 13 gunship cánh cố định và 21 B-52."
    year: "1970-1972"
    force: us
    provenance_level: S
    sources:
