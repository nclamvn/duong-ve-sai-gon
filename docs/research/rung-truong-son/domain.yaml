domain: rung_truong_son
entity_label: "Thành phần cảnh rừng nhiệt đới Trường Sơn (1971, cho game Đường về Sài Gòn)"

schema:
  type_field: nhom
  fields:
    - ten_khoa_hoc        # tên Latin (thực vật, động vật) hoặc thuật ngữ chuẩn (địa hình)
    - nhom                # tang_tan | cay_go | cay_bui_tham_tuoi | day_leo_bieu_sinh | tre_nua_co | dat_tham_la | da_dia_chat | suoi_nuoc | khi_hau_anh_sang | linh_truong | chim | gam_nhan | bo_sat_luong_cu | con_trung_khac | thu_lon | dau_vet_chien_tranh
    - vung_phan_bo        # nơi có ở Trường Sơn/Quảng Trị/Quảng Bình/Thừa Thiên/Lào (đông/tây Trường Sơn)
    - dai_cao_do          # mét so với mực nước biển
    - kich_thuoc          # chiều cao, đường kính, chiều dài thân, khối lượng, độ dốc, độ sâu...
    - hinh_thai_mau_sac   # thứ mắt thấy: hình dáng, màu, kết cấu bề mặt (dữ liệu cho hoạ sĩ)
    - hanh_vi_am_thanh    # hoạt động lúc nào, tiếng kêu/âm thanh, ở tầng nào
    - mua_thoi_tiet       # mùa mưa/khô, tháng, lượng mưa, nhiệt độ, độ ẩm, sương
    - mat_do_pho_bien     # dày/thưa/hiếm, mật độ, % che phủ, tình trạng 1971 nếu có
    - ghi_chu_game        # cố ý để trống khi chưa có nguồn: honest-null

rollup_field: nhom

universe:
  estimate: 260
  basis: "Sửa hai lần (120 → 200 sau mẻ 1 vì chưa tính nguồn asset; 200 → 260 sau mẻ 2 vì thêm công sự, trọng điểm đường 12 và 20, loài bổ sung). Ước lượng số thành phần cảnh đáng dựng cho M1–M2 (rừng già Trường Sơn, Đường 9): ~40 loài/nhóm thực vật, ~35 loài/nhóm động vật, ~25 yếu tố địa hình/nước/khí hậu, ~20 dấu vết chiến tranh, ~40 nguồn asset/âm thanh, ~40 địa danh và khí hậu cục bộ"

refresh_days:
  default: 3650

